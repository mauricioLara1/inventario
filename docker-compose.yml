services:
  db:
    image: postgres:17
    container_name: inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - inventario_pgdata:/var/lib/postgresql/data

volumes:
  inventario_pgdata:
